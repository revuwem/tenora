# Development stack: hot reload for web (next dev) and api (nest --watch).
#   bun run docker:dev
#
# Run it through scripts/docker.sh (the docker:dev scripts do): in a git worktree it
# picks a separate project name and host ports (API_PORT / WEB_PORT) so worktrees
# don't collide. The main checkout keeps 3000 / 8000.
#
# The repo is bind-mounted into /app so edits on the host reload the containers.
# Each node_modules directory is masked with an anonymous volume so the Linux
# dependencies installed in the image are used instead of the host's macOS ones.
# `-V` (used by the docker:dev script) recreates those volumes on every start,
# so dependency changes always come from the freshly built image.
name: tenora-dev

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      # Browser origin allowed to call the api (the web app's published port).
      - CORS_ORIGIN=http://localhost:${WEB_PORT:-3000}
      # Poll for changes: file events don't always cross the macOS bind mount.
      - CHOKIDAR_USEPOLLING=true
      - TSC_WATCHFILE=PriorityPollingInterval
      - TSC_WATCHDIRECTORY=FixedPollingInterval
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Browser calls the api on its published host port; the server side uses the
      # Docker network address.
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - API_INTERNAL_URL=http://api:8000
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
