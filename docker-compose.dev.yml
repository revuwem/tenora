# Development stack: hot reload for web (next dev) and api (nest --watch).
#   bun run docker:dev
#
# Run it through scripts/docker.sh (the docker:dev scripts do): in a git worktree it
# picks a separate project name and host ports (API_PORT / WEB_PORT) so worktrees
# don't collide. The main checkout keeps 3000 / 8000.
#
# The repo is bind-mounted into /app so edits on the host reload the containers.
# Each node_modules directory is masked with an anonymous volume so the Linux
# dependencies installed in the image are used instead of the host's macOS ones.
# `-V` (used by the docker:dev script) recreates those volumes on every start,
# so dependency changes always come from the freshly built image.
#
# Startup order: postgres (healthy) -> setup (builds contracts, migrates, seeds) -> api -> web.
# Postgres is not published to the host, so worktree stacks can't collide on its port.
# The api never migrates on startup: the one-shot `setup` service does it.
name: tenora-dev

x-api-dev: &api-dev
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: dev
  environment:
    - NODE_ENV=development
    - PORT=8000
    # Fake dev-only credentials; the database is only reachable on the compose network.
    - DATABASE_URL=postgres://tenora:tenora@postgres:5432/tenora
    - ORGANIZATION_NAME=${ORGANIZATION_NAME:-Demo Organization}
    # Fake dev-only values. The seeded Admin signs in with these.
    - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    - ADMIN_PASSWORD=${ADMIN_PASSWORD:-dev-admin-password}
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/api/node_modules
    - /app/packages/contracts/node_modules

services:
  # Keep the image, credentials and healthcheck in sync with the prod stack and ci.yml.
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=tenora
      - POSTGRES_PASSWORD=tenora
      - POSTGRES_DB=tenora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenora -d tenora"]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    <<: *api-dev
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        bun run --filter @tenora/contracts build
        && cd apps/api && bun run db:migrate && bun run db:seed
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgres://tenora:tenora@postgres:5432/tenora
      - BETTER_AUTH_SECRET=dev-only-secret-at-least-thirty-two-characters
      # The browser reaches the api through the web app's origin.
      - BETTER_AUTH_URL=http://localhost:${WEB_PORT:-3000}
      # Browser origin allowed to call the api (the web app's published port).
      - CORS_ORIGIN=http://localhost:${WEB_PORT:-3000}
      # Poll for changes: file events don't always cross the macOS bind mount.
      - CHOKIDAR_USEPOLLING=true
      - TSC_WATCHFILE=PriorityPollingInterval
      - TSC_WATCHDIRECTORY=FixedPollingInterval
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Browser calls the api on its published host port; the server side uses the
      # Docker network address.
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - API_INTERNAL_URL=http://api:8000
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  postgres-data:
