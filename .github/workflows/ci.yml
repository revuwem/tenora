name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run. Runs on main always finish,
# so every main commit refreshes the caches that PRs read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # With no inputs, the bun version comes from "packageManager" in package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies (reproducible)
        run: bun ci

      # Turbo's local cache: unchanged packages replay lint/type-check/test results.
      # A unique key per commit always saves a fresh cache; restore-keys loads the latest.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Run checks
        run: bun run check

  # Runs in parallel with `checks`: it only verifies that the production images build.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache in the GitHub Actions cache, one scope per image so they don't
      # overwrite each other. mode=max also caches the intermediate (install/build) stages.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: tenora-${{ matrix.app }}:ci
          # Only the web image reads it; matches docker-compose.prod.yml.
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Stable name for the branch ruleset's required check "docker-build": a matrix job is
  # reported as "<job> (<matrix value>)", so the ruleset can't require it by one name.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: docker-image
    if: ${{ always() }}

    steps:
      - name: Require all image builds to pass
        run: test "${{ needs.docker-image.result }}" = "success"
