name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run. Runs on main always finish,
# so every main commit refreshes the caches that PRs read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres for the migration step. Keep the image, credentials and healthcheck in sync
    # with docker-compose.dev.yml and docker-compose.prod.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tenora
          POSTGRES_PASSWORD: tenora
          POSTGRES_DB: tenora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenora -d tenora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://tenora:tenora@localhost:5432/tenora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # With no inputs, the bun version comes from "packageManager" in package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies (reproducible)
        run: bun ci

      # Component tests in web and ui run in a real Chromium (Vitest browser mode).
      # Browser binaries are not cached on purpose, as Playwright advises.
      - name: Install Chromium for browser tests
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      # Turbo's local cache: unchanged packages replay lint/type-check/test results.
      # A unique key per commit always saves a fresh cache; restore-keys loads the latest.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Proves the migrations apply to an empty database. Migrations are never run by
      # the api on startup.
      - name: Run database migrations
        run: bun run --filter api db:migrate

      - name: Run checks
        run: bun run check

  # Runs in parallel with `checks`: it only verifies that the production images build.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache in the GitHub Actions cache, one scope per image so they don't
      # overwrite each other. mode=max also caches the intermediate (install/build) stages.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: tenora-${{ matrix.app }}:ci
          # Only the web image reads it; matches docker-compose.prod.yml.
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
