# Production-like stack: optimized builds, no source mounts.
#   bun run docker:prod
# No container_name: fixed names would collide across worktrees (see scripts/docker.sh).
name: tenora-prod

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time, so it is baked per worktree.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_INTERNAL_URL=http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
